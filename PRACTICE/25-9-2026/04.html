<!--

4. Everything-in-one glossary page — a glossary (<dl>) where each definition also includes a <blockquote> example sentence and a <mark>-highlighted key word.
-->

<!DOCTYPE html>
<html>
    <head>
        <title>Glossary</title>
    </head>

    <body>
        <h1>Web Dev Glossary.</h1>

        <dl>
            <dt>Attribute</dt>
            <dd>
                Extra information added inside a tag.like <mark>href</mark> or src.<blockquote>Example:&lt; a href="page.html" &gt;link&lt;</blockquote>
            </dd>

            <dt>Elements</dt>
            <dd>A Complete tag wit it's content and closing tag, such as full <mark>Paragraph</mark>.<blockquote>Example:&lt; p&gt; Hello&lt;/p&gt; is one element.</blockquote>
            </dd>
        </dl>
    </body>
</html>

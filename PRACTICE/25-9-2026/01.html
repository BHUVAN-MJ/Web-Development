
<!--

1. Iframe embed — a page that embeds another page or a map inside itself using <iframe>. Look up the width, height, and title attributes, and why title matters for accessibility here.

-->
<!DOCTYPE html>
<html>
    <head>
        <title>Iframe</title>
    </head>

    <body>
        <h1>Embeded Page</h1>
        <iframe src="https://www.wikipedia.org" width="600" height="400" title="wikipedia" ></iframe>
    </body>
</html>

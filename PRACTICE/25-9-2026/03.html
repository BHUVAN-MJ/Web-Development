<!--

3. Nested semantic layout — a full page: <header> with <nav>, <main> containing two <article> elements (each with its own heading and paragraph), an <aside>, and a <footer> with a <small> copyright line. Bigger version of Day 3's exercise 5.

-->

<!DOCTYPE html>
<html>
    <head>
        <title>My site</title>
    </head>

    <body>
        <header>
            <h1>My site</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </nav>
        </header>

        <main>
            <article>
                <h2>Frist Post</h2>
                <p>This is my frist article on this page.</p>
            </article>

            <article>
                <h2>Second Post</h2>
                <p>This is a Second, separate article.</p>
            </article>

            <aside>
                <p>Tip:Keep each article focused on one topic.</p>
            </aside>
        </main>

        <footer>
            <small>&copy;2026 my site </small>
        </footer>
    </body>
</html>

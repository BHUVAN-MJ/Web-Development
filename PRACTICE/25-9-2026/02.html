<!---

2. Details and summary — a small FAQ page with 3 questions, each using <details> and <summary> so the answer is hidden until clicked. No JavaScript needed — this is a native HTML "accordion."

--->

<!DOCTYPE html>
<html>
    <head>
        <title>FAQ</title>
    </head>

    <body>
        <h1>FAQ</h1>

        <details>
            <summary>What is HTML?</summary>
            <p>HTML is a markup language used to Structure content on a webpage.</p>
        </details>

        <details>
            <summary>What is CSS?</summary>
            <p>CSS used to style how html elements look.</p>
        </details>

        <details>
            <summary>DO i need JavaScript to make a website?</summary>
            <p>No but it's needed for interactivity beyond whta HTML and CSS can do.</p>
        </details>
    </body>
</html>

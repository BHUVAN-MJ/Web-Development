<!--

5. Responsive image

Question: Show an image that switches to a different file on small screens, using the right tags so it still has alt text and doesn't jump around while loading.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image</title>
</head>
<body>
    <h1>Responsive Image</h1>
    <picture>
        <source media="(max-width: 600px)" srcset="images/photo-small.jpg">
        <img src="images/photo-large.jpg" alt="A mountain landscape at sunrise" width="800" height="500" loading="lazy">
    </picture>
</body>
</html>

<!---

2. Head metadata

Question: Write a page with a proper <head>: language, character encoding, viewport, and a description.

--->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A practice page to learn HTML metadata.">
    <title>Metadata Practice</title>
</head>
<body>
    <h1>Metadata Practice</h1>
    <p>Nothing looks different here, but the page is now set up properly.</p>
</body>
</html>

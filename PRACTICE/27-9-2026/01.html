
<!--

1. Text formatting

Question: Write a page that uses bold and emphasized text, a chemical formula (H₂O), a math expression (E = mc²), a price with the old value crossed out and a new value shown, an inline quote, and a horizontal line.

-->

<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting</title>
</head>
<body>
    <h1>Text Formatting</h1>
    <p>This is <strong>very important</strong> and this is <em>emphasized</em>.</p>
    <p>Water is H<sub>2</sub>O and Einstein wrote E = mc<sup>2</sup>.</p>
    <p>Price: <del>$50</del> <ins>$40</ins></p>
    <p>My teacher said, <q>Practice makes progress.</q></p>
    <hr>
    <p>Everything above the line was formatting practice.</p>
</body>
</html>

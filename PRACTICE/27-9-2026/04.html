<!--

4. Datalist, file upload, and color

Question: Build a profile-setup form with a city field that suggests options as you type but still allows other values, a file upload for a profile photo, and a favorite-color picker.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Setup</title>
</head>
<body>
    <h1>Profile Setup</h1>
    <form>
        <label for="city">City</label>
        <input list="cities" id="city" name="city">
        <datalist id="cities">
            <option value="Bengaluru">
            <option value="Mumbai">
            <option value="Delhi">
            <option value="Chennai">
        </datalist>
        <br><br>

        <label for="photo">Profile photo</label>
        <input type="file" id="photo" name="photo" accept="image/*">
        <br><br>

        <label for="color">Favorite color</label>
        <input type="color" id="color" name="color" value="#3366ff">
        <br><br>

        <button type="submit">Save Profile</button>
    </form>
</body>
</html>

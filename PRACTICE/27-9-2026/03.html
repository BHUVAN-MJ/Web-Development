<!--

3. Form with validation

Question: Build a sign-up form where the username, email, and password are required, the password must be at least 8 characters, and the phone number must be exactly 10 digits. Group the fields into two labeled sections.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
    <h1>Sign Up</h1>
    <form>
        <fieldset>
            <legend>Account</legend>
            <label for="user">Username</label>
            <input type="text" id="user" name="user" required>
            <br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" minlength="8" required>
        </fieldset>

        <fieldset>
            <legend>Contact</legend>
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Enter exactly 10 digits">
        </fieldset>

        <br>
        <button type="submit">Create Account</button>
    </form>
</body>
</html>

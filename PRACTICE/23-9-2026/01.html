
<!--

1. Definition list — a small glossary of 4-5 web dev terms (e.g. HTML, CSS, tag, attribute) using <dl>, <dt>, and <dd>. Different from <ul>/<ol> — it's a term/definition pair, not a bullet list.

-->

<!DOCTYPE html>
<html>
    <head>
        <title>Glossing</title>
    </head>

    <body>
        <h1>Web dev Glossing</h1>

        <dl>
            
            <dt>HTML</dt>
            <dd>The markup Languages used to structure the content on wesites</dd>

            <dt>CSS</dt>
            <dd>The Languages used to style the html></dd>

            <dt>Tags</dt>
            <dd>A key word warpped in angle</dd>

            <dt>Attributes</dt>
            <dd>Extra informartion added inside a href or src</dd>
        </dl>
    </body>
</html>

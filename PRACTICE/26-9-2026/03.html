<!DOCTYPE html>
<html>
    <head>
        <title>Input Type</title>
    </head>

    <body>
        <h1>Survey</h1>
        <form>
            <label for="dod">Date of Birth</label>
            <input type="date" id="dod" name="dod">
            <br><br>

            <label for="age">Age</label>
            <input type="number" id="age" name="age">
            <br><br>

            <label for="newsletter">Subscribe to news letter</label>
            <input type="checkbox" id="newsletter" name="newsletter">
            <br><br>

            <p>Favorite Season:</p>
            <input type="radio" id="summer" name="season" value="summer">
            <label for="summer">Summer</label>
            
            <input type="radio" id="winter" name="season" value="winter">
            <label for="winter">winter</label>
            <br><br>

            <label for="volume">volume</label>
            <input type="range" id="volume" name="volume" min="0" max="100">
            <br><br>
        </form>
    </body>
</html>

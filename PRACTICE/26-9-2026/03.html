<!--

3. Multi-select and dropdown — a form with a <select> dropdown (at least 4 options) and a checkbox group for "select all that apply" style multiple choices, using <optgroup> to group the dropdown options into two categories.

-->

<!DOCTYPE html>
<html>
<head>
    <title>Preferences</title>
</head>
<body>
    <h1>Preferences</h1>
    <form>
        <label for="food">Favorite food:</label>
        <select id="food" name="food">
            <optgroup label="Fruits">
                <option value="apple">Apple</option>
                <option value="mango">Mango</option>
            </optgroup>
            <optgroup label="Vegetables">
                <option value="carrot">Carrot</option>
                <option value="potato">Potato</option>
            </optgroup>
        </select>
        <br><br>

        <p>Hobbies (select all that apply):</p>
        <input type="checkbox" id="reading" name="hobbies" value="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" id="gaming" name="hobbies" value="gaming">
        <label for="gaming">Gaming</label>
        <input type="checkbox" id="sports" name="hobbies" value="sports">
        <label for="sports">Sports</label>
        <br><br>

        <button type="submit">Save</button>
    </form>
</body>
</html>

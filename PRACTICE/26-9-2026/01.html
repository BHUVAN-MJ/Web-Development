
<!--

1. Abbreviation and address — a page using <abbr title="..."> for an abbreviation (like "HTML") and <address> for a fictional contact address. Look up what makes <address> different from a plain <p>.

-->

<!DOCTYPE html>
<html>
<head>
    <title>Abbr and Address</title>
</head>
<body>
    <h1>About This Site</h1>
    <p>This site is built with <abbr title="HyperText Markup Language">HTML</abbr>.</p>

    <address>
        Written by Bhuvan<br>
        12 Example Street<br>
        Bengaluru, India<br>
        <a href="mailto:hello@example.com">hello@example.com</a>
    </address>
</body>
</html>

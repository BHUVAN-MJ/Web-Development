<!---

2. Ordered list variations — a top-10 countdown list using <ol> with the reversed attribute, and a separate list that starts counting from a custom number using start.

--->

<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>
    <h1>Top 5 Countdown</h1>
    <ol reversed>
        <li>Fifth place</li>
        <li>Fourth place</li>
        <li>Third place</li>
        <li>Second place</li>
        <li>First place</li>
    </ol>

    <h2>Steps starting at 5</h2>
    <ol start="5">
        <li>Step five</li>
        <li>Step six</li>
        <li>Step seven</li>
    </ol>
</body>
</html>

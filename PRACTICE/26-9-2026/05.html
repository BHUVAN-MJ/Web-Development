<!--

5. Full "portfolio" homepage — your biggest integration yet: <header> with <nav>, a <main> with a <section> for "About," a <section> for "Projects" (using a <figure> for each project with an image and caption), and a <footer> with social links. This introduces <section> — look up how it differs from <article>.

-->
    
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
</head>
<body>
    <header>
        <h1>Bhuvan's Portfolio</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About</h2>
            <p>I'm learning web development and building small projects to practice.</p>
        </section>

        <section id="projects">
            <h2>Projects</h2>

            <figure>
                <img src="images/project1.jpg" alt="Screenshot of my profile card page">
                <figcaption>Profile card: my first HTML page.</figcaption>
            </figure>

            <figure>
                <img src="images/project2.jpg" alt="Screenshot of my fan site">
                <figcaption>Fan site: a five-page linked site.</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <a href="https://github.com" target="_blank">GitHub</a>
        <a href="https://linkedin.com" target="_blank">LinkedIn</a>
    </footer>
</body>
</html>

<!--

Task 1: Structure. A page for a fictional cafe. Start with the full skeleton, including lang, charset, and a <title>. Use <header> with <nav> (three links to #menu, #hours, and #contact), then <main> with three <section>s that have those ids, and a <footer>.

Task 2: Menu table. Inside the menu section, add a table of four items with columns for Item, Price, and Vegetarian (yes/no). It must have a header row.

Task 3: Contact form. Inside the contact section, build a form with a required name, a required email, a <select> for "reason for contacting" (three options), a message box, and a submit button. Every field needs a properly connected label.

Task 4: Media and lists. Inside the hours section, add a figure with an image and caption, plus a nested list: days of the week grouped as "Weekdays" and "Weekend", each with an opening time listed under it.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe</title>
</head>
<body>
    <header>
        <nav>
            <a href="#">Menu</a>
            <a href="#">Hours</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section for="Menu">
            <table border="1">
                <thead>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Vegetarian</th>
                    <th>Yes/No</th>
                </thead>
            </table>
        </section>

        <section for="Contact">
            <form >
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">
                <br><br>
               
                <select name="text" id="reason for contacting">
                    <label for="reason for contacting"></label>

                    <button type="submit"></button>
                </select>
            </form>
        </section>

        <section for="Hours">
            <img src="images/0a6983a5-895e-4e68-9edb-88adf79211e9___RS_Early.B 9072.JPG" alt="A leaf img">

            <p>It's a leaf picture. the leaf in this img has no special meanig.</p>

            <ul>
                <li>
                    <ol>Weekdays
                        <li>Mon</li>
                        <li>Tue</li>
                        <li>Wed</li>
                        <li>Thu</li>
                        <li>Fri</li>

                    Time:10:00 AM to 7:00 PM</ol>
                </li>

                <li>
                    <ol>Weekend
                        <li>Sta</li>
                        <li>Sun</li>
                    Time:10:00 AM to 2:00 PM</ol>
                </li>

            </ul>

        </section>
    </main>
    
</body>
</html>

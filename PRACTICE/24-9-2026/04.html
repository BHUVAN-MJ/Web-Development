<!--

4. Progress and meter — a page showing a <progress> bar (e.g. "task completion") and a <meter> (e.g. "disk usage" or "rating out of 10"). Look up the difference in what each one is meant to represent.

-->
<!DOCTYPE html>
<html>
    <head>
        <title>Progress and Meter</title>
    </head>

    <body>
        <h1>Prgoress Bar</h1>
        <p>Task Completed:</p>
        <progress value="70" max="100"></progress>

        <p>Disk Manager</p>
        <meter value="0.8" min="0" max="1"></meter>
    </body>
</html>

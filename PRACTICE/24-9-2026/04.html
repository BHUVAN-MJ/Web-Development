<!--

4. Figure and figcaption — redo your day-1 image exercise, but wrap the <img> and its caption in <figure> and <figcaption> instead of <img> + <p>. Look up why this pairing exists instead of just using a div and a paragraph.

-->
<!DOCTYPE html>
<html>
    <head>
        <title>Image</title>
    </head>
    <body>
        <h1>Photo</h1>
        <figure>
            <img src="mages/0a6983a5-895e-4e68-9edb-88adf79211e9___RS_Early.B 9072.JPG" alt="A green leaf">

            <figcaption>A leaf photographed up close</figcaption>
        </figure>
    </body>
</html>

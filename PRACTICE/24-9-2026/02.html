<!---

2. Blockquote and citation — a page with a quote from someone, using <blockquote> for the quoted text and `` for who said it. Look up why <blockquote> isn't just a styled <p>.

--->

<!DOCTYPE html>
<html>
    <head>
        <title>Quote</title>
    </head>

    <body>
        <h1>Quoted Line</h1>
        <blockquote>
            The only way to do great work is to love what you do.
        </blockquote>
        <p>-Steve Jobs</p>
    </body>
</html>

<!--

3. Heading hierarchy — a page about any topic using <h1> through <h4>, each followed by a paragraph. Use exactly one <h1>. Look up why that rule exists.

-->

<!DOCTYPE html>

<html>
    <head>
        <title>Headings</title>
    </head>
    <body>
        <h1>Lorem, ipsum.</h1>
        <p>Lorem, ipsum.</p>

        <h2>Lorem, ipsum dolor.</h2>
        <p>Lorem, ipsum dolor.</p>

        <h3>Lorem ipsum dolor sit.</h3>
        <p>Lorem ipsum dolor sit.</p>

        <h4>Lorem ipsum dolor sit amet.</h4>
        <p>Lorem ipsum dolor sit amet.</p>
        
    </body>
</html>

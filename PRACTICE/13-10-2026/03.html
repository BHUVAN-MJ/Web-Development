<!--

Question 3 — Unordered list
Create a webpage titled My Favourite Things.
Requirements:
- Add a heading called My Favourite Things.
- Create a bulleted list containing five favourite foods, hobbies, or games.
- Use the correct HTML list tags.

-->

<!DOCTYPE html>
<html>
    <head>
        <title>My Favourite Things</title>
    </head>

    <body>
        <h1>My Favourite Things</h1>
        <ul>
            <li>gym</li>
            <li>Music</li>
            <li>Sleep</li>
            <li>Read</li>
            <li>reels</li>
        </ul>
    </body>
</html>

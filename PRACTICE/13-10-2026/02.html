<!--

Question 2 — Ordered list
Create a webpage titled My Daily Routine.
Requirements:
- Add a heading called My Daily Routine.
- Display five daily activities in numbered order.
- Use the correct HTML list tags.

-->

<!DOCTYPE html>
<html>
    <head>
        <title>My Daily Routine</title>
    </head>

    <body>
        <h1>My Daily Routine</h1>
        
        <ol>
            <li>Wake up</li>
            <li>Eat</li>
            <li>Shower</li>
            <li>Sleep</li>
            <li>gym</li>
        </ol>

    </body>

</html>

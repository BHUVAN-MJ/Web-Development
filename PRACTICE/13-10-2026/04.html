<!--

Question 4 — Hyperlinks
Create a webpage titled My Favourite Websites.
Requirements:
- Add a heading called My Favourite Websites.
- Add links to Google, YouTube, and GitHub.
- Each link should have a readable name.
- Clicking each link should open the correct website.

-->

<!DOCTYPE html>
<html>
    <head>
        <title>My Favourite Websites</title>
    </head>

    <body>
        <h1>My Favourite Websites.</h1>
        <a href="https://www.google.com">Google</a>
        <br>
        <a href="https://www.youtube.com">YouTube</a>
        <br>
        <a href="https://www.github.com">Git Hub</a>
    </body>
</html>

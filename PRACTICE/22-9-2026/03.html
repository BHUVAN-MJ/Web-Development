<!--

3. Semantic layout — rebuild your profile card from day 1, but this time wrap it using layout tags instead of just <body>: a <header> for the name/title, a <main> containing the bio and hobbies, and a <footer> with the link. Look up what <header>, <main>, <footer>, and <nav> are for and why they're preferred over plain <div>s for these roles.

-->

<!DOCTYPE html>
<html>
    <head>
        <title>About Me</title>
    </head>

    <body>
        <header>
            <h1>Bhuvan</h1>
        </header>

        <main>
            <p>Hello there,its me bhuvan.I am someone with a big dream.</p>
            <br>
            <ul>
                <li>Reading</li>
                <li>Sleeping</li>
                <li>Gaming</li>
            </ul>
        </main>

        <footer>
            <a href="https://github.com">My GitHub</a>
        </footer>
    </body>
</html>

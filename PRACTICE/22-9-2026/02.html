<!--

2. Nested lists — a page about a topic with sub-categories, e.g. "Programming Languages" with items like "Frontend" and "Backend", each containing its own sub-list of examples. This tests nesting a <ul> inside an <li>.

-->

<!DOCTYPE html>
<html>
    <head>
        <title>Programming Languages</title>
    </head>

    <body>
        <h1>Programming Languages</h1>
        <ul>
            <li>Frontend
                <ul>
                    <li>Javascript</li>
                    <li>Typescript</li>
                </ul>
            </li>

            <li>Backend
                <ul>
                    <li>Python</li>
                    <li>Java</li>
                </ul>
            </li>
        </ul>
    </body>
</html>

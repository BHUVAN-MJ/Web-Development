Question 2 — Create a marks table
Create a webpage titled Exam Results.
Requirements:
- Add the heading Exam Results.
- Create columns for Subject, Marks, and Maximum Marks.
- Add at least four subjects.
- Add a final row showing the total marks obtained and total maximum marks.

<!DOCTYPE html>
<html>
    <head>
        <title>Exam Results</title>
    </head>

    <body>
        <h1>Exam Results</h1>
        <table>
            <thead>
                <tr>
                    <th>Subjects</th>
                    <th>Marks</th>
                    <th>Maximum Marks</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>English</td>
                    <td>80</td>
                    <td>100</td>
                </tr>

                <tr>
                    <td>Maths</td>
                    <td>75</td>
                    <td>100</td>
                </tr>

                <tr>
                    <td>Scince</td>
                    <td>80</td>
                    <td>100</td>
                </tr>

                <tr>
                    <td>Kannada</td>
                    <td>85</td>
                    <td>100</td>
                </tr>

                <tr>
                    <td>Sum</td>
                    <td>320</td>
                    <td>400</td>
                </tr>
            </tbody>
        </table>

    </body>

</html>

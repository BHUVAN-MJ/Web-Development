<!--

Question 3 — Practise text formatting
Create a webpage titled About My Learning.
Requirements:
- Add a heading About My Learning.
- Write a paragraph about learning HTML.
- Make one word bold.
- Make one word italic.
- Underline one important word.

<!DOCTYPE html>
<html>
    <head>
        <title>My Learning</title>
    </head>

    <body>
        <h1>My learning</h1>
        <p>Hello, There i am learning <b>html</b> for a few <i>days</i> and i think it's really cool.HTML stands for <u>Hyper Text Markup Language</u></p>
        <hr>
    </body>
</html>

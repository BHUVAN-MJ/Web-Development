<!DOCTYPE html>
<html>
    <head>
        <title>HTML Lists</title>
    </head>

    <body>
        <ul>
            <li>Coffe</li>
            <li>Tea</li>
            <li>Milk</li>
        </ul>

        <ol>
            <li>Tea</li>
            <li>Milk</li>
            <li>Coffe</li>
        </ol>

        <dl>
            <dt>Coffee</dt>
            <dd>Coffe is a drink that you can drink.</dd>
        </dl>
    </body>
</html>
